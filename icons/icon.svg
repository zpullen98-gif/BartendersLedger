<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- felt ground -->
  <rect width="512" height="512" rx="96" fill="#14312a"/>
  <rect width="512" height="512" rx="96" fill="url(#vign)"/>
  <defs>
    <radialGradient id="vign" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1d443a"/>
      <stop offset="100%" stop-color="#0d211c"/>
    </radialGradient>
  </defs>
  <!-- double brass rule border -->
  <rect x="34" y="34" width="444" height="444" rx="70" fill="none" stroke="#c9a44c" stroke-width="6"/>
  <rect x="50" y="50" width="412" height="412" rx="58" fill="none" stroke="#c9a44c" stroke-width="2"/>
  <!-- coupe glass -->
  <g fill="none" stroke="#e6cc8a" stroke-width="14" stroke-linecap="round">
    <!-- bowl -->
    <path d="M146 168 C150 250 196 292 256 292 C316 292 362 250 366 168 Z" fill="#e6cc8a" fill-opacity="0.14"/>
    <!-- liquid line -->
    <path d="M162 206 C186 246 218 266 256 266 C294 266 326 246 350 206" stroke-width="8" stroke="#c9a44c"/>
    <!-- stem -->
    <line x1="256" y1="292" x2="256" y2="382"/>
    <!-- foot -->
    <path d="M186 396 C186 388 214 382 256 382 C298 382 326 388 326 396 L326 400 L186 400 Z" fill="#e6cc8a" fill-opacity="0.14"/>
  </g>
  <!-- garnish: cherry on a pick -->
  <line x1="216" y1="128" x2="300" y2="180" stroke="#c9a44c" stroke-width="6" stroke-linecap="round"/>
  <circle cx="272" cy="163" r="17" fill="#a1453d" stroke="#c9a44c" stroke-width="4"/>
  <!-- small brass diamond, art-deco pip -->
  <path d="M256 428 L268 442 L256 456 L244 442 Z" fill="#c9a44c"/>
</svg>
